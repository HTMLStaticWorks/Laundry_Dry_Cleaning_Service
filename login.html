<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | FreshFlow Laundry</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path fill='%230EA5E9' d='M50 5 C50 5 15 50 15 70 A35 35 0 0 0 85 70 C85 50 50 5 50 5 Z'/><circle cx='40' cy='60' r='6' fill='%23FFFFFF' opacity='0.7'/></svg>" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 position-relative overflow-hidden" style="background: #0F172A;">

  <!-- Local Background Video Stream -->
  <div class="hero-video-wrap">
    <video autoplay loop muted playsinline>
      <source src="videos/4119968-hd_1920_1080_30fps.mp4" type="video/mp4">
    </video>
    <div class="hero-video-overlay"></div>
  </div>

  <!-- Top Right Corner Floating Controls (Same as Home Page) -->
  <div class="position-fixed top-0 end-0 m-3 z-3 d-flex gap-2 align-items-center">
    <button class="btn btn-sm btn-outline-info rounded-circle p-2" id="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme" style="width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;">
      <i class="bi bi-moon-stars-fill fs-6" id="theme-toggle-icon"></i>
    </button>
    <button class="btn btn-sm btn-outline-info rounded-circle p-2 me-1" id="rtl-toggle-btn" title="Toggle RTL" aria-label="Toggle RTL" style="width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;">
      <i class="bi bi-arrow-left-right fs-6"></i>
    </button>
  </div>

  <div class="container position-relative z-2 py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8 col-sm-10">
        
        <div class="glass-card p-3 p-sm-4 p-md-5 rounded-4 shadow-lg border">
          
          <!-- Card Header with Centered Brand Logo (No Hover Scaling Effect) -->
          <div class="text-center pb-3 mb-4 border-bottom">
            <a href="index.html" class="auth-brand-logo navbar-brand-logo text-dark fs-2 justify-content-center mb-1">
              <i class="bi bi-droplet-half text-info me-1"></i> FreshFlow
            </a>
          </div>

          <div class="text-center mb-4">
            <h4 class="fw-bold mb-1 text-dark">Welcome Back</h4>
            <p class="text-muted small">Sign in to your luxury laundry dashboard</p>
          </div>

          <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="mb-3">
              <label class="form-label fw-semibold text-dark">Email Address</label>
              <input type="email" class="form-control rounded-pill py-2 px-3" value="alexander.wright@luxury.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold text-dark">Password</label>
              <div class="password-input-wrapper">
                <input type="password" id="login-password" class="form-control rounded-pill py-2 ps-3 pe-5" value="••••••••••••" required>
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)" aria-label="Toggle Password Visibility">
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-nowrap gap-2">
              <div class="form-check mb-0 text-nowrap">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label text-muted small text-nowrap" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="small text-primary fw-semibold text-nowrap">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-fresh-primary w-100 py-3 mb-3 fw-bold text-nowrap"><i class="bi bi-box-arrow-in-right me-2"></i> Sign In To Dashboard</button>
            
            <div class="text-center text-muted small mb-3">OR SIGN IN WITH</div>

            <div class="d-flex gap-2 w-100 mb-4">
              <button type="button" class="btn social-login-btn flex-fill py-2 rounded-pill"><i class="bi bi-google text-danger me-1"></i> Google</button>
              <button type="button" class="btn social-login-btn flex-fill py-2 rounded-pill"><i class="bi bi-apple text-dark me-1"></i> Apple</button>
            </div>

            <div class="text-center pt-2 border-top">
              <small class="text-muted">Don't have an account? <a href="register.html" class="text-primary fw-bold">Create Account</a></small>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
