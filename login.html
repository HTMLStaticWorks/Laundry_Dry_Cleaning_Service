<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | FreshFlow Laundry</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path fill='%230EA5E9' d='M50 5 C50 5 15 50 15 70 A35 35 0 0 0 85 70 C85 50 50 5 50 5 Z'/><circle cx='40' cy='60' r='6' fill='%23FFFFFF' opacity='0.7'/></svg>" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 position-relative overflow-hidden" style="background: #0F172A;">

  <!-- Local Background Video Stream -->
  <div class="position-absolute top-0 start-0 w-100 h-100 opacity-30 z-0">
    <video autoplay loop muted playsinline class="w-100 h-100 object-fit-cover">
      <source src="videos/4119968-hd_1920_1080_30fps.mp4" type="video/mp4">
    </video>
  </div>

  <canvas id="bubbles-canvas"></canvas>

  <div class="container position-relative z-2 py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand-logo text-white fs-2 d-inline-block">
            <i class="bi bi-droplet-half text-info me-2"></i> FreshFlow
          </a>
          <p class="text-white-50 mt-1">Sign in to your luxury laundry account</p>
        </div>

        <div class="glass-card p-4 p-md-5 rounded-4 shadow-lg">
          <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" class="form-control rounded-pill py-2 px-3" value="alexander.wright@luxury.com" required>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label fw-semibold mb-0">Password</label>
                <a href="#" class="small text-primary">Forgot?</a>
              </div>
              <input type="password" class="form-control rounded-pill py-2 px-3" value="••••••••••••" required>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label text-muted small" for="rememberMe">Remember me for 30 days</label>
            </div>

            <button type="submit" class="btn btn-fresh-primary w-100 py-3 mb-3">Sign In To Dashboard</button>
            
            <div class="text-center text-muted small mb-3">OR SIGN IN WITH</div>

            <div class="d-flex gap-2 mb-4">
              <button type="button" class="btn btn-outline-secondary w-50 py-2 rounded-pill"><i class="bi bi-google me-1"></i> Google</button>
              <button type="button" class="btn btn-outline-secondary w-50 py-2 rounded-pill"><i class="bi bi-apple me-1"></i> Apple</button>
            </div>

            <div class="text-center">
              <small class="text-muted">Don't have an account? <a href="register.html" class="text-primary fw-bold">Create Account</a></small>
            </div>
          </form>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-white-50 small"><i class="bi bi-arrow-left me-1"></i> Return to Homepage</a>
        </div>

      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
